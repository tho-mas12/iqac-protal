<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <base href="/course-plan/">
  <title>Course Plan 2026 - 2027 (Even) | IQAC - St. Joseph's College</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html {
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    /* Touch optimizations */
    button, select, input, textarea {
      touch-action: manipulation;
    }

    /* Hide scrollbars for swipeable tab bars while maintaining scrollability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Field validation shake */
    .is-invalid-field {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25) !important;
      animation: fieldShake 0.4s ease-in-out !important;
    }
    @keyframes fieldShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    /* Universal Responsive Card View for Mobile Screens (<= 768px) */
    @media (max-width: 768px) {
      .mobile-card-table thead {
        display: none !important;
      }
      .mobile-card-table, 
      .mobile-card-table tbody, 
      .mobile-card-table tr, 
      .mobile-card-table td {
        display: block !important;
        width: 100% !important;
      }
      .mobile-card-table tr {
        margin-bottom: 0.85rem !important;
        background: #ffffff !important;
        border: 1.5px solid #e2e8f0 !important;
        border-radius: 1rem !important;
        padding: 0.85rem !important;
        box-shadow: 0 1px 4px 0 rgba(0, 0, 0, 0.05) !important;
      }
      .mobile-card-table td {
        padding: 0.35rem 0 !important;
        border: none !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 0.2rem !important;
        text-align: left !important;
      }
      .mobile-card-table td::before {
        content: attr(data-label);
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        color: #64748b;
        letter-spacing: 0.03em;
      }
      .mobile-card-table td[data-label="Action"],
      .mobile-card-table td[data-label="Actions"] {
        flex-direction: row !important;
        align-items: center !important;
        justify-content: flex-end !important;
        gap: 0.5rem !important;
        padding-top: 0.5rem !important;
        border-top: 1px dashed #e2e8f0 !important;
        margin-top: 0.35rem !important;
      }
      .mobile-card-table td[data-label="Action"]::before,
      .mobile-card-table td[data-label="Actions"]::before {
        margin-right: auto !important;
      }
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #course-plan-print-doc, #course-plan-print-doc * {
        visibility: visible;
      }
      #course-plan-print-doc {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        border: none !important;
        box-shadow: none !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Application Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-3 sm:px-8 py-2.5 sm:py-3.5 flex flex-wrap items-center justify-between gap-2.5 sm:gap-4 shadow-xs no-print">
    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-black text-base sm:text-lg shadow-sm shadow-indigo-600/30 shrink-0">
        <i data-lucide="book-marked" class="w-4 h-4 sm:w-5 sm:h-5"></i>
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-1.5 sm:gap-2">
          <span class="text-[10px] sm:text-xs font-black tracking-tight text-slate-900 uppercase">IQAC</span>
          <span class="text-slate-300">•</span>
          <span class="text-[10px] sm:text-xs font-semibold text-slate-500 truncate">St. Joseph's College (Autonomous)</span>
        </div>
        <h1 class="text-xs sm:text-sm font-extrabold text-indigo-900 truncate">
          Course Plan – Academic Year 2026–2027 (Even Semester)
        </h1>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
      <!-- Dynamic Auth Status / Logged-in Session Badge -->
      <div id="header-auth-section">
        <!-- Shows user role badge and logout button when logged in -->
      </div>
    </div>
  </header>

  <!-- Main App Container -->
  <main class="flex-1 w-full px-3 sm:px-8 py-4 sm:py-6 max-w-[1600px] mx-auto">
    <div id="course-plan-root" class="w-full">
      <div class="p-8 sm:p-12 text-center text-slate-400 font-bold">
        Loading Course Plan module...
      </div>
    </div>
  </main>

  <!-- Institutional Footer -->
  <footer class="bg-white border-t border-slate-200 px-3 sm:px-8 py-3 text-xs text-slate-500 no-print flex flex-col sm:flex-row items-center justify-between gap-2 max-w-[1600px] mx-auto w-full">
    <div class="text-center sm:text-left text-[11px] sm:text-xs">
      Internal Quality Assurance Cell (IQAC) • St. Joseph's College (Autonomous), Tiruchirappalli - 620 002
    </div>
    <div>
      <a href="/course-plan/login" class="text-slate-400 hover:text-indigo-600 transition font-bold text-[11px] sm:text-xs">
        HOD Login
      </a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/course-plan-app.js?v=20261114E"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.coursePlanApp) {
        window.coursePlanApp.init();
      }
    });
  </script>
</body>
</html>
