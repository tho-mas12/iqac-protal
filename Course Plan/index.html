<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/course-plan/">
  <title>Course Plan 2026 - 2027 (Even) | IQAC - St. Joseph's College</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #course-plan-print-doc, #course-plan-print-doc * {
        visibility: visible;
      }
      #course-plan-print-doc {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        border: none !important;
        box-shadow: none !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Application Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4 shadow-xs no-print">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-black text-lg shadow-sm shadow-indigo-600/30">
        <i data-lucide="book-marked" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-black tracking-tight text-slate-900 uppercase">Internal Quality Assurance Cell (IQAC)</span>
          <span class="text-slate-300">•</span>
          <span class="text-xs font-semibold text-slate-500">St. Joseph's College (Autonomous)</span>
        </div>
        <h1 class="text-sm font-extrabold text-indigo-900">
          Course Plan – Academic Year 2026–2027 (Even Semester)
        </h1>
      </div>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
      <!-- Dynamic Auth Status / Logged-in Session Badge -->
      <div id="header-auth-section">
        <!-- Shows user role badge and logout button when logged in -->
      </div>
    </div>
  </header>

  <!-- Main App Container -->
  <main class="flex-1 w-full px-4 sm:px-8 py-6 max-w-[1600px] mx-auto">
    <div id="course-plan-root" class="w-full">
      <div class="p-12 text-center text-slate-400 font-bold">
        Loading Course Plan module...
      </div>
    </div>
  </main>

  <!-- Institutional Footer -->
  <footer class="bg-white border-t border-slate-200 px-4 sm:px-8 py-3.5 text-xs text-slate-500 no-print flex flex-col sm:flex-row items-center justify-between gap-2 max-w-[1600px] mx-auto w-full">
    <div>
      Internal Quality Assurance Cell (IQAC) • St. Joseph's College (Autonomous), Tiruchirappalli - 620 002
    </div>
    <div>
      <a href="/course-plan/login" class="text-slate-400 hover:text-indigo-600 transition font-bold">
        HOD Login
      </a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/course-plan-app.js?v=20261107I"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.coursePlanApp) {
        window.coursePlanApp.init();
      }
    });
  </script>
</body>
</html>
